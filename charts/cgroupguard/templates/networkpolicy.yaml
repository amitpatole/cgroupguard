{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cgroupguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cgroupguard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cgroupguard.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.networkPolicy.metricsAllowFrom }}
    - from: {{- toYaml .Values.networkPolicy.metricsAllowFrom | nindent 8 }}
      ports:
        - {port: {{ .Values.metrics.port }}, protocol: TCP}
    {{- end }}
    # The kubelet's health probes come from the node and are allowed by most CNIs; if yours
    # blocks them, add the node network to metricsAllowFrom and the probe port here.
{{- end }}
