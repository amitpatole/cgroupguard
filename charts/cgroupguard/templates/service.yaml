apiVersion: v1
kind: Service
metadata:
  name: {{ include "cgroupguard.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cgroupguard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "cgroupguard.selector" . | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics, protocol: TCP}
