apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cgroupguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cgroupguard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "cgroupguard.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cgroupguard.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cgroupguard.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "cgroupguard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.probes.port }}
            - --leader-elect={{ .Values.leaderElection }}
            - --leader-election-namespace={{ .Release.Namespace }}
            {{- if .Values.controller.prometheusURL }}
            - --prometheus-url={{ .Values.controller.prometheusURL }}
            {{- end }}
            {{- if .Values.controller.nodeEvents }}
            - --node-events
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - {name: metrics, containerPort: {{ .Values.metrics.port }}, protocol: TCP}
            - {name: probes, containerPort: {{ .Values.probes.port }}, protocol: TCP}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
