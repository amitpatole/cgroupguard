apiVersion: v2
name: cgroupguard
description: Optional in-cluster controller for cgroup v1 to v2 readiness scans. Read-only toward the cluster; writes only the status of its own resource and Events.
type: application
version: 0.1.0-dev.8
appVersion: "0.1.0-dev.8"
kubeVersion: ">=1.30.0-0"
keywords: [cgroup, kubernetes, upgrade, readiness]
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: "Apache-2.0"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "true"
  artifacthub.io/images: |
    - name: controller
      image: ghcr.io/amitpatole/cgroupguard:0.1.0-dev.8
  artifacthub.io/crds: |
    - kind: CgroupReadiness
      version: v1alpha1
      name: cgroupreadinesses.cgroupguard.io
      displayName: Cgroup readiness
      description: Scheduled cgroup v1 to v2 readiness scan.
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/amitpatole/cgroupguard

