name: Bug or wrong result
description: cgroupguard crashed, gave a wrong or confusing result, or a generated plan does not fit your platform.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please remove anything private first: no kubeconfigs, tokens or real cluster reports.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cgroupguard --version`
      placeholder: cgroupguard version 0.1.1
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: console
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: The report's "Limitation" lines (if any)
      render: text
  - type: dropdown
    id: platform
    attributes:
      label: Where you ran it
      options:
        - "Linux amd64"
        - "Linux arm64"
        - "macOS"
        - "Windows"
        - "Container image"
        - "In-cluster controller"
  - type: input
    id: cluster
    attributes:
      label: Cluster (Kubernetes version and provider, for example 1.34 on EKS)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, kubeconfigs and real cluster names or reports from this issue.
          required: true
