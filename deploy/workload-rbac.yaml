# Bind separately to the scanning identity. No Secret or ConfigMap access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cgroupguard-workloads
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
  # Optional: lets cgroupguard measure recoverability. Without it the report says
  # pdb=unknown and continues; it never fails the scan.
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list]
