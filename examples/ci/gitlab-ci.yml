# Example only. Copy distribution/action/install.sh into your repository (review it first), commit your Cosign
# public key, and pin the version. Installation fails closed if the signature or checksum does not match.
upgrade-gate:
  stage: test
  image: alpine:3.20            # pin by digest in real use
  variables:
    CGROUPGUARD_VERSION: "0.1.0"
    BASE_URL: "https://github.com/amitpatole/cgroupguard/releases/download"
  before_script:
    - apk add --no-cache bash curl tar cosign
    - VERSION="$CGROUPGUARD_VERSION" BASE_URL="$BASE_URL" PUBKEY=ci/cgroupguard-cosign.pub DEST="$CI_PROJECT_DIR/bin" ci/install-cgroupguard.sh
  script:
    - export PATH="$CI_PROJECT_DIR/bin:$PATH"
    - cgroupguard check --target-version 1.35 --exit-error --fail-on warning --format sarif > cgroupguard.sarif
  artifacts:
    when: always
    paths: [cgroupguard.sarif]
